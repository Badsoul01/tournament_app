<!-- PŘIHLAŠOVACÍ TLAČÍTKO / MENU -->
<div style="margin-bottom: 15px;">
    {% if session.get('organizer_id') %}
        <!-- Stav: Přihlášen -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; max-width: 400px;">
            <span>👤 Organizátor: <strong>{{ session.get('organizer_name') }}</strong></span>
            <form action="/logout" method="POST" style="margin: 0;">
                <button type="submit" style="padding: 4px 10px; cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 3px;">Odhlásit se</button>
            </form>
        </div>
    {% else %}
        <!-- Stav: Odhlášen - Tlačítko pro zobrazení formuláře -->
        <div id="login-trigger-container">
            <button type="button"
                    onclick="var box = document.getElementById('login-form-popup'); box.style.display = box.style.display === 'none' ? 'block' : 'none';"
                    style="padding: 6px 14px; cursor: pointer; background: #f1f1f1; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; color: #333;">
                🔑 Přihlásit se / Registrovat
            </button>
        </div>

        <!-- Skrytý formulář, který se rozbalí po kliknutí na tlačítko -->
        <div id="login-form-popup" style="display: none; margin-top: 10px; padding: 12px; background: #fff; border: 1px solid #ccc; border-radius: 4px; max-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <form hx-post="/auth" hx-target="#auth-message" hx-swap="innerHTML" style="margin: 0;">

                {% if tournament %}
                    <input type="hidden" name="tournament_id" value="{{ tournament.id }}">
                {% endif %}

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <input type="text" name="username" placeholder="Jméno (např. daniel)" required style="padding: 6px; border: 1px solid #ccc; border-radius: 3px;">
                    <input type="password" name="password" placeholder="Heslo" required style="padding: 6px; border: 1px solid #ccc; border-radius: 3px;">
                    <button type="submit" style="padding: 6px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 3px; font-weight: bold;">Vstoupit</button>
                </div>

                <div id="auth-message" style="color: red; margin-top: 5px; font-weight: bold; font-size: 0.85em;"></div>

                <small style="color: #666; display: block; margin-top: 8px; font-size: 0.8em;">
                    Nezadané jméno vytvoří nový účet automaticky.
                </small>
            </form>
        </div>
    {% endif %}
</div>
