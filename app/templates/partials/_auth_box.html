
<!-- PŘIHLAŠOVACÍ TLAČÍTKO / MENU -->
<div class="auth-wrapper">
    {% if session.get('organizer_id') %}
        <!-- Stav: Přihlášen -->
        <div id="logout-trigger-container">
            <button type="button"
                    class="auth-trigger-btn"
                    onclick="event.stopPropagation(); toggleAuthPopup('logout-form-popup', this);"
                    title="Přihlášen jako {{ session.get('organizer_name') }}">
                👤
            </button>
        </div>

        <!-- Vyskakovací okno pro přihlášeného -->
        <div id="logout-form-popup" class="auth-popup auth-popup-logout">
            <div class="mb-12 font-md text-muted">
                Přihlášen jako:<br>
                <strong class="text-main" style="font-size: 1.05em;">{{ session.get('organizer_name') }}</strong>
            </div>

            {% if can_reconfigure and tournament %}

                <form
                    action="{{ url_for('main.edit_tournament', tournament_id=tournament.id) }}"
                    method="GET"
                    class="auth-action-form"
                >
                    <button type="submit" class="auth-action-btn">
                        ⚙ Upravit turnaj
                    </button>
                </form>
                <form
                    action="{{ url_for('main.delete_tournament', tournament_id=tournament.id) }}"                    method="POST"
                    class="auth-action-form"
                    onsubmit="return confirm('Opravdu chcete tento turnaj trvale smazat?');"
                >
                    <button
                        type="submit"
                        class="auth-delete-btn"
                    >
                        🗑 Smazat turnaj
                    </button>
                </form>

            {% endif %}



            <form action="/logout" method="POST" class="mb-0">
                <button type="submit" class="auth-logout-btn w-100">
                    Odhlásit se
                </button>
            </form>
        </div>
    {% else %}
        <!-- Stav: Odhlášen -->
        <div id="login-trigger-container">
            <button type="button"
                    class="auth-trigger-btn"
                    onclick="event.stopPropagation(); toggleAuthPopup('login-form-popup', this);"
                    title="Přihlásit se">
                🗝️
            </button>
        </div>

        <!-- Skrytý formulář pro přihlášení -->
        <div id="login-form-popup" class="auth-popup auth-popup-login">
            <form hx-post="/auth" hx-target="#auth-message" hx-swap="innerHTML" class="mb-0">

                {% if tournament %}
                    <input type="hidden" name="tournament_id" value="{{ tournament.id }}">
                {% endif %}

                <div class="auth-form-stack flex-col flex-gap8">
                    <input type="text" name="username" placeholder="Jméno (např. daniel)" required class="auth-input-field w-100">
                    <input type="password" name="password" placeholder="Heslo" required class="auth-input-field w-100">

                    <button type="submit" class="auth-submit-btn w-100">
                        Vstoupit
                    </button>
                </div>

                <div id="auth-message" class="text-danger fw-bold font-sm" style="margin-top: 8px;"></div>

                <small class="text-muted font-sm" style="display: block; margin-top: 8px;">
                    Nezadané jméno vytvoří nový účet automaticky.
                </small>
            </form>
        </div>
    {% endif %}
</div>
