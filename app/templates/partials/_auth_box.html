<!-- PŘIHLAŠOVACÍ TLAČÍTKO / MENU -->
<div class="auth-wrapper">
    {% if session.get('organizer_id') %}
        <!-- Stav: Přihlášen -->
        <div id="logout-trigger-container">
            <button type="button"
                    class="auth-trigger-btn"
                    onclick="event.stopPropagation(); toggleAuthPopup('logout-form-popup', this);"
                    title="Přihlášen jako {{ session.get('organizer_name') }}">
                👤
            </button>
        </div>

        <!-- Vyskakovací okno pro přihlášeného -->
        <div id="logout-form-popup" class="auth-popup auth-popup-logout">
            <div style="margin-bottom: 12px; font-size: 0.9em; color: var(--text-muted);">
                Přihlášen jako:<br>
                <strong style="color: var(--text-main); font-size: 1.05em;">{{ session.get('organizer_name') }}</strong>
            </div>
            <form action="/logout" method="POST" style="margin: 0;">
                <button type="submit" class="auth-logout-btn">
                    Odhlásit se
                </button>
            </form>
        </div>
    {% else %}
        <!-- Stav: Odhlášen -->
        <div id="login-trigger-container">
            <button type="button"
                    class="auth-trigger-btn"
                    onclick="event.stopPropagation(); toggleAuthPopup('login-form-popup', this);"
                    title="Přihlásit se">
                🗝️
            </button>
        </div>

        <!-- Skrytý formulář pro přihlášení -->
        <div id="login-form-popup" class="auth-popup auth-popup-login">
            <form hx-post="/auth" hx-target="#auth-message" hx-swap="innerHTML" style="margin: 0;">

                {% if tournament %}
                    <input type="hidden" name="tournament_id" value="{{ tournament.id }}">
                {% endif %}

                <div class="auth-form-stack">
                    <input type="text" name="username" placeholder="Jméno (např. daniel)" required class="auth-input-field">
                    <input type="password" name="password" placeholder="Heslo" required class="auth-input-field">

                    <button type="submit" class="auth-submit-btn">
                        Vstoupit
                    </button>
                </div>

                <div id="auth-message" style="color: var(--danger-color); margin-top: 8px; font-weight: bold; font-size: 0.85em;"></div>

                <small style="color: var(--text-muted); display: block; margin-top: 8px; font-size: 0.8em;">
                    Nezadané jméno vytvoří nový účet automaticky.
                </small>
            </form>
        </div>
    {% endif %}
</div>
