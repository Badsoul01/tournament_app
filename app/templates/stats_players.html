
{% extends "base_stats.html" %}

{% block stats_content %}
    <h2>Globální žebříček hráčů</h2>

    <!-- HTMX Vyhledávací formulář -->
    <form method="GET" action="/stats/players" style="margin-bottom: 20px;">
        <input type="hidden" name="sort_by" value="{{ sort_by }}">
        <input type="hidden" name="order" value="{{ order }}">

        <input type="text" name="q" value="{{ q }}" placeholder="🔍 Hledat hráče..."
               hx-get="/stats/players"
               hx-target="#players-table-container"
               hx-swap="outerHTML"
               hx-trigger="keyup changed delay:300ms, search"
               style="padding: 6px; width: 250px;">

        <a href="/stats/players" style="margin-left: 10px; color: #1976d2; text-decoration: none;">Zrušit filtr</a>
    </form>

    <!-- Zde se vkládá tabulka (vyrenderuje se z partialu nebo přímo) -->
    {% include "partials/_players_table.html" %}

{% endblock %}
