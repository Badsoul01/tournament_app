{% extends "base_tournament.html" %}
{% block extra_style %}
<style>
   .group-container {
       display: flex;
       flex-wrap: wrap;
       gap: 20px;
       margin-bottom: 20px;
   }
   .group-left, .group-right {
       flex: 1;
       min-width: 300px;
   }
   tr.qualifying-row td {
       background-color: #c3e6cb !important;
   }
   .match-card {
       border: 1px solid #ccc;
       padding: 10px;
       margin-bottom: 10px;
       background: #fafafa;
       border-radius: 4px;
   }
</style>
{% endblock %}

{% block content %}
    <h2>ZÁKLADNÍ SKUPINY</h2>

    {% for group_name, data in group_data.items() %}
        <details open>
            <summary><strong>Skupina {{ group_name }}</strong></summary>

            <!-- Cílový kontejner pro HTMX. Při odeslání dat se překreslí jen jeho vnitřek -->
            <div id="group-{{ group_name }}">
                {% include "partials/_group_content.html" %}
            </div>
        </details>
        <hr>
    {% endfor %}
{% endblock %}
