<ul class="clean-list">
    {% for t in recent_tournaments %}
    <li class="mb-4">
        <a href="#"
           hx-get="/wizard/past-tournament/{{ t.id }}/players"
           hx-target="#past-players-container"
           class="tournament-list-link">
            {{ t.name }} <small class="text-muted">({{ t.date.strftime('%d.%m.') }})</small>
        </a>
    </li>
    {% else %}
    <li class="text-muted font-sm" style="font-style: italic; padding: 5px;">Žádný turnaj nenalezen</li>
    {% endfor %}
</ul>
