<div style="margin-top: 40px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 20px;">

    <form action="/tournament_settings" method="POST" class="mb-0">

        {% if wizard.check_readiness() %}

            <button
                type="submit"
                name="action"
                value="next"
            >
                Generovat turnaj
            </button>

        {% else %}

            <button type="button" disabled>
                Turnaj není připraven
            </button>

            <div
                class="font-md"
                style="margin-top: 15px; color: var(--danger-color);"
            >
                <strong>
                    Před vygenerováním turnaje je nutné:
                </strong>

                <ul
                    style="
                        list-style-position: inside;
                        padding-left: 0;
                        margin-top: 5px;
                        color: var(--danger-color);
                    "
                >
                    {% for error in wizard.get_readiness_errors() %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>

        {% endif %}

    </form>

</div>
