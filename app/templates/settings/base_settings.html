<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nastavení turnaje</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/perchanment.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <h1>Nastavení turnaje</h1>
    <!-- Navigační menu je nyní venku (nad pergamenem) -->
    {% include "settings/partials/_nav_menu.html" %}

    <!-- Hlavní pergamen obalující už jen samotný obsah -->
    <div class="scroll-parchment">
        <!-- Roztřepené boční okraje pergamenu -->
        <div class="parchment-side parchment-left"></div>
        <div class="parchment-side parchment-right"></div>

        <!-- Hlavní obsah -->
        <main style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/authBox.js') }}"></script>
</body>
</html>
