{% extends "base_stats.html" %}

{% block stats_content %}
    <h2>Historie zápasů</h2>

    <!-- HTMX Vyhledávací formulář -->
    <form method="GET" action="/stats/matches" style="margin-bottom: 20px;">
        <input type="hidden" name="sort_by" value="{{ sort_by }}">
        <input type="hidden" name="order" value="{{ order }}">

        <input type="text" name="q" value="{{ q }}" placeholder="🔍 Hledat hráče nebo turnaj..."
               hx-get="/stats/matches"
               hx-target="#matches-table-container"
               hx-swap="outerHTML"
               hx-trigger="keyup changed delay:300ms, search"
               style="padding: 6px; width: 300px;">

        <a href="/stats/matches" style="margin-left: 10px; color: #1976d2; text-decoration: none;">Zrušit filtr</a>
    </form>

    <br>

    {% include "partials/_matches_table.html" %}

    <script src="{{ url_for('static', filename='js/rows_details.js') }}?v=1"></script>
{% endblock %}
