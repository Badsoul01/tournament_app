<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiky</title>

    <!-- Připojení našeho jednotného externího CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <div class="stats-container">
        <h1>Statistiky</h1>

        <!-- Navigační menu pro statistiky s ošetřeným ohraničením -->
        <nav style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color);">
            <a href="/" style="justify-self: start;">Domů</a>
            <div>
                <a href="/stats/tournaments">Turnaje</a>
                <a href="/stats/players">Hráči</a>
                <a href="/stats/matches">Zápasy</a>
            </div>
        </nav>

        <!-- Dynamický blok, do kterého se načte konkrétní obsah záložky -->
        <main id="stats-content">
            {% block stats_content %}
            {% endblock %}
        </main>

        <br>
    </div>
</body>
</html>
