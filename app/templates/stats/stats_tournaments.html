{% extends "stats/base_stats.html" %}

{% block stats_content %}
    <h2>Statistiky turnajů</h2>

    <!-- Formulář je venku -> fokus v inputu zůstane zachován při psaní -->
    <form method="GET" action="/stats/tournaments" style="margin-bottom: 20px;">
        <input type="hidden" name="sort_by" value="{{ sort_by }}">
        <input type="hidden" name="order" value="{{ order }}">

        <input type="text" name="q" value="{{ q }}" placeholder="🔍 Hledat turnaj, vítěze, datum nebo počet hráčů..."
               hx-get="/stats/tournaments"
               hx-target="#tournaments-table-container"
               hx-swap="innerHTML"
               hx-trigger="keyup changed delay:300ms, search"
               hx-include="[name='sort_by'], [name='order']"
               style="padding: 6px; width: 330px;">
    </form>

    <br>

    <!-- Kontejner pro tabulku, kam se dynamicky nahraje i tlačítko zrušení filtru -->
    <div id="tournaments-table-container">
        {% include "stats/partials/_tournaments_table.html" %}
    </div>

    <script src="{{ url_for('static', filename='js/rows_details.js') }}?v=1"></script>
{% endblock %}
